---
- name: Stop and Disable AlertManager Services
  systemd:
    daemon_reexec: true
    daemon_reload: true
    name: "{{ item }}"
    enabled: false
    state: stopped
  ignore_errors: true
  register: stop_alertmanager_services
  with_items:
    - prometheus


- name: Delete the AlertManager Config and Binary Files
  file: path={{ item.dest }} state=absent
  ignore_errors: true
  register: delete_config_files
  with_items:
    - { src: "alertmanager.yml.j2",              dest: "/etc/alertmanager/alertmanager.yml" }
    - { src: "alertmanager.systemd.j2",          dest: "/etc/systemd/system/alertmanager.service" }
    - { src: "alertmanager binary",              dest: "/usr/local/bin/alertmanager" }
    - { src: "amtool binary",                    dest: "/usr/local/bin/amtool" }

