---
- name: Check OS ( Grafana & AlertManager )
  fail: msg="Not a Red Hat based system!"
  when: ansible_os_family != 'RedHat' or ansible_os_family != 'CentOS' or  ansible_os_family != 'Rocky'


- name: Set Facts for Package Name and List and Network Range
  import_tasks: set-facts.yml
  tags: testfact, install, uninstall, setup, remove, verify, create, delete, start, stop, enable, disable, config, check


- name: Install GO Language
  import_tasks: install-go.yml
  tags: install, setup
  when: (( go is defined and go == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']


- name: Install Pip Modules
  import_tasks: install-pip.yml
  tags: install, setup
  when: (( pip is defined and pip == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']


- name: Add User
  import_tasks: add-user.yml
  tags: add, install
  when: (( user is defined and user == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']


- name: Install AlertManager
  import_tasks: install-alertmanager.yml
  tags: install, setup
  when: (( alertmanager is defined and alertmanager == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']


- name: Uninstall AlertManager
  import_tasks: uninstall-alertmanager.yml
  tags: uninstall, remove
  when: (( alertmanager is defined and alertmanager == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']


- name: Uninstall Pip Modules
  import_tasks: uninstall-pip.yml
  tags: uninstall, remove
  when: (( pip is defined and pip == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']


- name: Uninstall GO language
  import_tasks: uninstall-go.yml
  tags: uninstall, remove
  when: (( go is defined and go == true ) or ( alertmanager_all is defined and alertmanager_all == true )) and inventory_hostname in groups['monitor']

