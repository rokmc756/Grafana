---
- name: Check OS ( PostgreSQL Single Instance )
  fail: msg="Not a Red Hat based system!"
  when: ansible_os_family != 'RedHat' or ansible_os_family != 'CentOS' or  ansible_os_family != 'Rocky'


- name: Set Facts for Package Name and List and Network Range
  import_tasks: set-facts.yml
  tags: install, uninstall, init, uninit, enable, disable, config, stop, add
  when: inventory_hostname in groups['database']


- name: Enable PGDB Postgres Repository
  import_tasks: enable-repo.yml
  tags: enable, install
  when: (( repo is defined and repo == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Stop and Diable Firewalld and SELinux
  import_tasks: security/disable-security.yml
  tags: disable, install
  when: (( security is defined and security == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Add Postgres System User
  import_tasks: add-sys-user.yml
  tags: add, install
  when: (( sysuser is defined and sysuser == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Install Common Prerequisties and PGDG Postgres RPM Packages
  import_tasks: install-pkgs.yml
  tags: install
  when: (( pkgs is defined and pkgs == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Initialize PGDG Postgres Instance
  import_tasks: init-pgsql.yml
  tags: init, install
  when: (( postgres is defined and postgres == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Create Database and Users
  import_tasks: add-users.yml
  tags: install, add
  when: (( user is defined and user == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Enable SSL for Single PGDG Postgres
  import_tasks: enable-ssl.yml
  tags: enable, config, install
  when: (( ssl is defined and ssl == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Check the status of Single PGDG Postgres
  import_tasks: check-status.yml
  tags: install
  when: (( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Stop and Disable PostgreSQL
  import_tasks: stop-pgsql-service.yml
  tags: uninstall, destroy, delete, stop
  when: (( service is defined and service == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Uninit PostgreSQL
  import_tasks: uninit-pgsql.yml
  tags: uninit, uninstall
  when: (( db is defined and db == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Uninstall Common Prerequisties and PGDG Postgres RPM Packages
  import_tasks: uninstall-pkgs.yml
  tags: uninstall
  when: (( pkgs is defined and pkgs == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Enable Firewalld and SELinux
  import_tasks: security/enable-security.yml
  tags: enable, uninstall
  when: (( security is defined and security == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Remove config files of environment for Single PGDG Postgres
  import_tasks: remove-config-files.yml
  tags: uninstall, remove
  when: (( files is defined and files == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Disable PGDB Postgres Repository
  import_tasks: disable-repo.yml
  tags: disable, uninstall
  when: (( repo is defined and repo == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Remove Postgres System User
  import_tasks: remove-sys-user.yml
  tags: remove, uninstall
  when: (( sysuser is defined and sysuser == true ) or ( pgsql_all is defined and pgsql_all == true )) and inventory_hostname in groups['database']


- name: Upgrade RPM Packages for Single PGDG Postgres
  import_tasks: upgrade.yml
  tags: upgrade
  when: inventory_hostname in groups['database']

