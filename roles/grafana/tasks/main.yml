---
- name: Check OS ( Grafana )
  fail: msg="Not a Red Hat based system!"
  when: ansible_os_family != 'RedHat' or ansible_os_family != 'CentOS' or  ansible_os_family != 'Rocky'


- name: Set Facts for Package Name and List and Network Range
  import_tasks: set-facts.yml
  tags: testfact, install, uninstall, setup, remove, verify, create, delete, start, stop, enable, disable, check


- name: Install GO Language
  import_tasks: install-go.yml
  tags: install, delete
  when: (( go is defined and go == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Install Pip Modules
  import_tasks: install-pip.yml
  tags: install, delete
  when: (( pip is defined and pip == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Install Grafana and Influx Database Packages
  import_tasks: install-grafana.yml
  tags: install, deploy
  when: (( grafana is defined and grafana == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Enable SSL on Grafana Server Service
  import_tasks: enable-grafana-ssl.yml
  tags: install, enable
  when: (( ssl is defined and ssl == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Install Warp Benchmark
  import_tasks: install-warp.yml
  tags: setup, install
  when: ( warp is defined and warp == true ) or ( grafana_all is defined and grafana_all == true )


- name: Unistall Grafana and Influx Database Packages
  import_tasks: uninstall-grafana.yml
  tags: uninstall, destroy
  when: (( grafana is defined and grafana == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Uninstall Pip Modules
  import_tasks: uninstall-pip.yml
  tags: uninstall
  when: (( pip is defined and pip == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Uninstall GO language
  import_tasks: uninstall-go.yml
  tags: uninstall, delete
  when: (( go is defined and go == true ) or ( grafana_all is defined and grafana_all == true )) and inventory_hostname in groups['monitor']


- name: Upgrade Grafana and Prometheus
  import_tasks: upgrade.yml
  tags: upgrade

