---
- name: Stop and Disable Grafana Services
  systemd:
    daemon_reexec: true
    daemon_reload: true
    name: "{{ item }}"
    enabled: false
    state: stopped
  register: stop_grafana_services
  with_items:
    - grafana-server
    - influxdb


- name: Uninstall Dependent and Grafana RPM Packages
  package:
    name: "{{ item }}"
    state: absent
  register: uninstall_pkgs
  ignore_errors: true
  async: 120
  poll: 5
  with_items:
    - influxdb2-cli
    - influxdb2
    - grafana-pcp
    - grafana


- name: Delete the Config Files
  file: path={{ item.dest }} state=absent
  register: delete_config_files
  with_items:
    - { dest: "/etc/grafana/grafana.ini" }
    - { dest: "/etc/yum.repos.d/influxdata.repo" }
    - { dest: "/etc/grafana/grafana.crt" }
    - { dest: "/etc/grafana/grafana.key" }
    - { dest: "/etc/grafana/grafana.csr" }
    - { dest: "/etc/grafana" }
    - { dest: "/var/lib/grafana" }
    - { dest: "/var/log/grafana" }

