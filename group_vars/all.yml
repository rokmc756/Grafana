_grafana:
  cluster_name: jack-kr-grafana
  major_version: ""
  minor_version: ""
  patch_version: ""
  build_version: ""
  os_version: el9
  arch_type: x86_64
  bin_type: rpm
  admin_user: admin
  admin_password: changeme
  home_dir: "/home/postgres"
  base_dir: "/root"
